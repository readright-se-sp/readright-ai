services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MAI_SITE_ADDRESS: ${MAI_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./server
    image: readright-mai-server
    restart: unless-stopped
    environment:
      MAI_API_KEY: ${MAI_API_KEY:?set MAI_API_KEY in the shell or in the root .env}
      MAI_LOG_LEVEL: ${MAI_LOG_LEVEL:-INFO}
      MAI_SCRATCH_DIR: /scratch
      MAI_REDIS_URL: redis://redis:6379/0
      MAI_AUDIO_WORKER_URL: http://audio-worker:8001
      MAI_VIDEO_WORKER_URL: http://video-worker:8002
      MAI_S3_BUCKET: ${MAI_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
    volumes:
      - scratch:/scratch
    depends_on:
      redis:
        condition: service_healthy
      audio-worker:
        condition: service_healthy
      video-worker:
        condition: service_healthy

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  audio-worker:
    build: ./audio
    image: readright-mai-audio
    restart: unless-stopped
    environment:
      AUDIO_PHONETIC_ENABLED: ${AUDIO_PHONETIC_ENABLED:-false}
      AUDIO_WORKER_MAX_CONCURRENT_JOBS: ${AUDIO_WORKER_MAX_CONCURRENT_JOBS:-1}
      AUDIO_WORKER_LOG_LEVEL: ${AUDIO_WORKER_LOG_LEVEL:-INFO}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - scratch:/scratch:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s

  video-worker:
    build: ./video
    image: readright-mai-video
    restart: unless-stopped
    cpus: ${MAI_VIDEO_CPUS:-4}
    # Passed through only when set in the shell or the root .env; unset keeps the image default
    # from video/app/config.py.
    environment:
      - MAI_VIDEO_LOG_LEVEL
      - MAI_VIDEO_MAX_CONCURRENT_JOBS
      - MAI_VIDEO_SAMPLE_FPS
      - MAI_VIDEO_USE_POSE
      - MAI_VIDEO_EXPRESSION_MIN_RANGE
      - MAI_VIDEO_EXPRESSION_GROUP_MIN_RANGE
      - MAI_VIDEO_POINTING_MIN_TOTAL_MS
      - MAI_VIDEO_POINTING_EXTENDED_MAX_BEND_DEG
      - MAI_VIDEO_SWEEP_MIN_COUNT
    volumes:
      - scratch:/scratch:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  scratch:
  redis-data:
  caddy_data:
  caddy_config:
