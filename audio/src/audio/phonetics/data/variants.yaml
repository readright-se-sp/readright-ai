# Pronunciations added to espeak's own, for function words and heteronyms.
# Key: lowercase spoken form. Value: pronunciations, each a string of space-separated IPA segments.
the: ["ð ə", "ð i"]
a: ["ə", "eɪ"]
an: ["ə n", "æ n"]
and: ["ə n d", "æ n d", "ə n"]
to: ["t ə", "t u"]
of: ["ə v", "ʌ v"]
for: ["f ɚ", "f ɔ ɹ"]
was: ["w ə z", "w ʌ z"]
from: ["f ɹ ə m", "f ɹ ʌ m"]
at: ["ə t", "æ t"]
can: ["k ə n", "k æ n"]
you: ["j u", "j ə"]
read: ["ɹ i d", "ɹ ɛ d"]
live: ["l ɪ v", "l aɪ v"]
lead: ["l i d", "l ɛ d"]
wind: ["w ɪ n d", "w aɪ n d"]
tear: ["t ɪ ɹ", "t ɛ ɹ"]
close: ["k l oʊ s", "k l oʊ z"]
wound: ["w u n d", "w aʊ n d"]
bow: ["b oʊ", "b aʊ"]
