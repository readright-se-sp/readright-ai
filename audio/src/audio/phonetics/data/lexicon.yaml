# PLACEHOLDER: pronunciations not yet reviewed by a Filipino speaker.
# Filipino proper nouns and loanwords. An entry REPLACES espeak for that word.
# Key: lowercase spoken form. Value: the Filipino pronunciation first, then the anglicised one
# (children may read either). Each pronunciation is a string of space-separated IPA segments.
# Filipino form: five vowels (a ɛ i o u), tap ɾ for r, ŋ for ng, no aspiration, no stress.
