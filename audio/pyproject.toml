[project]
name = "readright-audio"
version = "0.1.0"
description = "ReadRight audio analysis microservice (CrisperWhisper word lane)"
requires-python = ">=3.11"
dependencies = [
    "whisperx>=3.8",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyright"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
extraPaths = ["src", "."]
reportMissingTypeStubs = false
