[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readright-audio"
dynamic = ["version"]
description = "ReadRight MAI audio lane"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "phonemizer>=3.3",
    "pyyaml",
    "torch>=2.6",
    "transformers>=4.40,<5",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.version]
path = "src/audio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/audio"]
include = ["src/audio/phonetics/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "espeak: needs the espeak-ng system library (skipped when it is missing)",
    "model: needs the model weights in the Hugging Face cache, or network access to download them",
    "gpu: needs CUDA (skipped when it is missing)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
