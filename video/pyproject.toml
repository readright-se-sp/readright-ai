[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readright-video"
dynamic = ["version"]
description = "ReadRight MAI video lane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
# Ruff would reformat python code blocks in ROADMAP.md; markdown is not ours to format.
exclude = ["*.md"]
